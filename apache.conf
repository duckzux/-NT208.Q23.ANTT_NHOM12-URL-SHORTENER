<VirtualHost *:80>
    DocumentRoot /var/www/html/frontend
    ServerName localhost

    # Serve frontend from /
    <Directory /var/www/html/frontend>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Serve backend API from /backend/
    Alias /backend /var/www/html/backend
    <Directory /var/www/html/backend>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Short URL redirect: /r/{code} → backend/redirect.php?code={code}
    RewriteEngine On
    RewriteRule ^/r/([a-zA-Z0-9_\-]+)$ /backend/redirect.php?code=$1 [L,QSA]

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
