<!--Trang chính-->
<!DOCTYPE html>
<html>
    <head>
        <title>URL Shortener</title>
        <meta charset="utf-8">
        <meta name="description" content="Đồ án Lập trình ứng dụng web by DucHanh">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/navbar.css">
        <link rel="stylesheet" href="css/result.css">
    </head>
    <body>
        <header>
            <nav class="nav-bar">
                <div class="logo"><a href="index.html">URL SHORTENER</a></div>
                <div class="nav-link"></div>
            </nav>
        </header>
        <main class="hero">
            <h1>URL SHORTENER</h1>
            <p class="describe" style="color: alicewhite;">Shorten your URL and analytics click</p>
            <div class="main-box">
                <div class="input-group">
                    <i class="fa-solid fa-link" aria-hidden="true"></i>
                    <form class="formshort" action="">
                        <input type="text" placeholder="Paste your URL here" id="shortform" name="shortform">
                        <button type="submit" class="btn-shorten">Rút gọn</button>
                    </form>
                </div>
                <div class="options-link">
                    <button class="btn-option" id="togglebtn">Tùy chọn</button>
                    <div class="hidden" id="custom-box">
                        <div class="custom-field">
                            <label for="alias-group">Custom alias:</label>
                            <input type="text" placeholder="Enter your alias here" id="alias-group" class="alias-group">
                        </div>
                        <div class="custom-field">
                            <label for="date-group">Expiration date:</label>
                            <input type="date" id="date-group" class="date-group">
                        </div>
                    </div>
                </div>
            </div>

            <div id="result-section" class="result-section hidden">
                <div class="result-card">
                    <span class="result-label">Short URL của bạn</span>
                    <div class="result-url-box">
                        <a id="result-link" href="#" target="_blank" rel="noopener noreferrer"></a>
                        <button class="btn-copy" id="btn-copy" title="Copy to clipboard">
                            <i class="fa-regular fa-copy"></i>
                        </button>
                    </div>
                    <p class="result-original" id="result-original"></p>
                </div>
            </div>
        </main>
        <script src="js/api.js"></script>
        <script src="js/auth.js"></script>
        <script src="js/shorten.js"></script>
    </body>
</html>
