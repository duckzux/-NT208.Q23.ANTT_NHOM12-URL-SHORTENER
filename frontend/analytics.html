<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics - URL Shortener</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/analytics.css">
</head>
<body>
    <header>
        <nav class="nav-bar">
            <div class="nav-left">
                <div class="logo"><a href="index.html">URL SHORTENER</a></div>
                <div class="nav-pages"></div>
            </div>
            <div class="nav-link"></div>
        </nav>
    </header>

    <main class="analytics-main">
        <div class="container-fluid px-4">

            <div id="loadingMsg" class="text-center py-5">
                <div class="spinner-border" role="status" style="color:#6366f1;"></div>
                <p class="mt-3" style="color:#aaa;">Đang tải analytics...</p>
            </div>

            <div id="analyticsContent" style="display:none;">
                <div class="d-flex justify-content-between align-items-start mb-4 flex-wrap gap-2">
                    <div>
                        <h2 class="mb-1" style="color:#fff;">Analytics</h2>
                        <p class="mb-0 small" id="urlInfo"></p>
                    </div>
                    <a href="dashboard.html" class="btn btn-outline-secondary btn-sm">
                        <i class="fa fa-arrow-left me-1"></i> Quay lại Dashboard
                    </a>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-6 col-md-3">
                        <div class="stat-card">
                            <div class="stat-icon"><i class="fa fa-mouse-pointer"></i></div>
                            <div class="stat-value" id="statTotal">0</div>
                            <div class="stat-label">Tổng lượt click</div>
                        </div>
                    </div>
                    <div class="col-6 col-md-3">
                        <div class="stat-card">
                            <div class="stat-icon"><i class="fa fa-calendar-day"></i></div>
                            <div class="stat-value" id="statToday">0</div>
                            <div class="stat-label">Hôm nay</div>
                        </div>
                    </div>
                    <div class="col-6 col-md-3">
                        <div class="stat-card">
                            <div class="stat-icon"><i class="fa fa-chart-line"></i></div>
                            <div class="stat-value" id="statAvg">0</div>
                            <div class="stat-label">Trung bình/ngày</div>
                        </div>
                    </div>
                    <div class="col-6 col-md-3">
                        <div class="stat-card">
                            <div class="stat-icon"><i class="fa fa-globe"></i></div>
                            <div class="stat-value" id="statCountries">0</div>
                            <div class="stat-label">Quốc gia</div>
                        </div>
                    </div>
                </div>

                <div class="row g-4">
                    <div class="col-12">
                        <div class="chart-card">
                            <h5 class="chart-title">Lượt click theo ngày (30 ngày gần nhất)</h5>
                            <canvas id="lineChart" height="80"></canvas>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="chart-card">
                            <h5 class="chart-title">Top Referers</h5>
                            <canvas id="refererChart" height="220"></canvas>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="chart-card">
                            <h5 class="chart-title">Top Quốc gia</h5>
                            <canvas id="countryChart" height="220"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <div id="errorMsg" class="text-center py-5" style="display:none;">
                <i class="fa fa-exclamation-triangle fa-3x mb-3" style="color:#f59e0b;"></i>
                <h4 style="color:#fff;">Không thể tải analytics</h4>
                <p id="errorText" style="color:#aaa;"></p>
                <a href="dashboard.html" class="btn btn-primary mt-2">Quay lại Dashboard</a>
            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/analytics.js"></script>
</body>
</html>
