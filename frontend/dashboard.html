<!DOCTYPE html>
<html>
    <head>
        <title>URL Shortener</title>
        <meta charset="utf-8">
        <meta name = "description" content="Đồ án Lập trình ứng dụng web by DucHanh">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/navbar.css">
        <link rel="stylesheet" href="css/dashboard.css">
    </head>
    <body>
        <header>
            <nav class="nav-bar">
                <div class="logo"><a href="index.html">URL SHORTENER</a></div>
                <div class="nav-link">
                    <a href="index.html">Home</a>
                    <a href="index.html" class="btn-reg">Log-out</a>
                </div>
            </nav>
        </header>
        <main class="hero">
            <h1>Tổng quan</h1> 
            <div class="box">
                <div class="leftbox">
                    <h3>Tổng số Link</h3>
                    <p class="stat-number" id="totalLinks">0</p>
                </div>
                <div class="rightbox">
                    <h3>Tổng lượt Click</h3>
                    <p class="stat-number" id="totalClicks">0</p>
                </div>
            </div>
            <div class="title-sheet">
            <h4>Danh sách URL của bạn</h4>
            <a href="analytics.html" class="analyze">Xem thống kê chi tiết</a>
            </div>
            <div class="table-responsive shadow-sm rounded">
                <table class="table mb-0 text-white" style="--bs-table-bg: transparent; --bs-table-color: white;">
                <thead>
                    <tr>
                        <th width="15%">Short URL</th>
                        <th width="35%">Long URL</th>
                        <th width="5%" class="text-center">Clicks</th>
                        <th width="10%">Ngày tạo</th>
                        <th width="10%">Ngày hết hạn</th>
                        <th width="25%" class="text-center">Hành động</th>
                    </tr>
                </thead>
                <tbody id="urlTableBody">
                    <tr>
                        <td>
                            <a href="#" class="fw-bold text-decoration-none">domain.com/aB3xYz</a>
                        </td>
                        <td>
                            <span class="text-break" title="https://example.com/very/long/url/that/needs/to/be/shortened">
                                https://example.com/very/long/url/that/needs/to/be/shortened
                            </span>
                        </td>
                        <td class="text-center">
                            <span class="badge bg-primary rounded-pill">512</span>
                        </td>
                        <td class="text-center">15/04/2026</td>
                        <td class="text-center">31/12/2026</td>    
                        <td>
                            <button class="btn btn-sm btn-outline-secondary me-1" title="Copy">
                                Copy
                            </button>
                            <button class="btn btn-sm btn-outline-danger" title="Xóa">
                                Xóa
                            </button>
                        </td>                 
                    </tr>
                    <tr>

                        <td>
                            <a href="#" class="fw-bold text-decoration-none"></a>
                        </td>
                        <td>
                            <span class="text-break" title="">
                            </span>                            
                        </td>
                        <td class="text-center">
                            <span class="badge bg-primary rounded-pill">512</span>                            
                            
                        </td>
                        <td class="text-center"></td>
                        <td class="text-center">
                        </td>
                        <td>                            
                            <button class="btn btn-sm btn-outline-secondary me-1" title="Copy">
                                Copy
                            </button>
                            <button class="btn btn-sm btn-outline-danger" title="Xóa">
                                Xóa
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
            </div>
        </main>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
        <script src="js/api.js"></script>
        <script src="js/auth.js"></script>
        <script src="js/dashboard.js"></script>
</body>
</html>
