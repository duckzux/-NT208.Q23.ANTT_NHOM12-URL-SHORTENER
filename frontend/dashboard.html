<!--Trang tổng quan người dùng-->
<!DOCTYPE html>
<html lang="vi">
    <head>
        <title>Dashboard - URL Shortener</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/navbar.css">
        <link rel="stylesheet" href="css/dashboard.css">
    </head>
    <body>
        <header>
            <nav class="nav-bar">
                <div class="logo"><a href="index.html">URL SHORTENER</a></div>
                <div class="nav-link">
                    <a href="index.html">Home</a>
                    <a href="index.html" class="btn-reg">Log-out</a>
                </div>
            </nav>
        </header>
        <main class="hero">
            <h1>Tổng quan</h1>
            <div class="box">
                <div class="leftbox">
                    <h3>Tổng số Link</h3>
                    <p class="stat-number" id="totalLinks">0</p>
                </div>
                <div class="rightbox">
                    <h3>Tổng lượt Click</h3>
                    <p class="stat-number" id="totalClicks">0</p>
                </div>
            </div>
            <div class="title-sheet">
                <h4>Danh sách URL của bạn</h4>
                <a href="index.html" class="analyze">+ Tạo URL mới</a>
            </div>
            <div class="table-responsive shadow-sm rounded">
                <table class="table mb-0 text-white" style="--bs-table-bg: transparent; --bs-table-color: white;">
                    <thead>
                        <tr>
                            <th width="15%">Short URL</th>
                            <th width="35%">Long URL</th>
                            <th width="5%" class="text-center">Clicks</th>
                            <th width="10%">Ngày tạo</th>
                            <th width="10%">Hết hạn</th>
                            <th width="25%" class="text-center">Hành động</th>
                        </tr>
                    </thead>
                    <tbody id="urlTableBody">
                        <tr>
                            <td colspan="6" class="text-center py-4" style="color:#aaa;">
                                <div class="spinner-border spinner-border-sm me-2" role="status"></div>
                                Đang tải...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
        <script src="js/api.js"></script>
        <script src="js/utils.js"></script>
        <script src="js/auth.js"></script>
        <script src="js/dashboard.js"></script>
    </body>
</html>
