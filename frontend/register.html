<!DOCTYPE html>
<html>
    <head>
        <title>URL Shortener</title>
        <meta charset="utf-8">
        <meta name = "description" content="Đồ án Lập trình ứng dụng web by DucHanh">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <header>
            <nav class="nav-bar">
                <div class="logo"><a href="index.html">URL SHORTENER</a></div>
                <div class="nav-link">
                    <a href="signin.html">Sign-in</a>
                    <a href="register.html" class="btn-reg">Register</a>
                </div>
            </nav>
        </header>
        <section id = "boxsignup">
            <form class ="valform">
                <h1>Register</h1>
                <div class ="formbox">
                    <label for="mail">Email:</label><br>
                    <input type="text" placeholder = "Enter email" id="mail" name="mail"><br>            
                    <label for="usrname">Username: </label><br>
                    <input type ="text" placeholder = "Enter username" id="usrname" name="usrname"><br>
                    <label for="pwd">Password: </label><br>
                    <input type ="text" placeholder = "Enter password" id="pwd" name="pwd"><br>                
                    <label for="cfpwd">Confirm password:</label><br>
                    <input type ="text" placeholder = "Enter password" id="repwd" name="repwd"><br>                 
                    <input type="submit" value="Register">  
                    <p style="font-weight: 300; font-size: 15px;">You have an account?<a href="signin.html" class="hr"> Sign-in here!</a></p>
                </div>    
            </form>
        </section>
</body>
</html>
